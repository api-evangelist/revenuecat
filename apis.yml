aid: revenuecat
url: https://raw.githubusercontent.com/api-evangelist/revenuecat/refs/heads/main/apis.yml
name: RevenueCat
kind: company
description: RevenueCat provides in-app subscription and purchase infrastructure for
  mobile and web apps. It abstracts App Store, Google Play, Amazon, Stripe, Roku,
  and Paddle billing behind cross-platform SDKs and a REST API, handling receipt
  validation, entitlements, subscriber state, offerings and paywalls, experiments,
  and subscription analytics. A v1 REST API manages live subscribers and purchases;
  a v2 REST API manages the project catalog (projects, apps, products, entitlements,
  offerings, packages); webhooks stream subscription lifecycle events.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/revenuecat.png
tags:
- Subscriptions
- In-App Purchases
- Billing
- Mobile
- Entitlements
