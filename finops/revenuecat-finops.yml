description: >-
  FinOps view of RevenueCat spend. RevenueCat's own cost is a percentage of the
  revenue it tracks rather than a per-API-call charge: $0 up to $2,500 monthly
  tracked revenue (MTR), then 1% of MTR above that on the Pro plan, 1% of
  conversions for Growth Tools, and negotiated volume discounts on Enterprise.
  Cost therefore scales with subscription revenue, so the primary FinOps levers
  are accurate revenue tracking configuration, entitlement hygiene, and
  Enterprise volume terms rather than request throttling.
notes: >-
  Percentage-of-tracked-revenue pricing means RevenueCat cost is a function of
  billed subscription revenue; verify MTR definition and any volume discounts
  during reconciliation.
sources:
- https://www.revenuecat.com/pricing/
