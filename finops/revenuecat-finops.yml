meters:
- name: monthly_tracked_revenue
  description: Subscription and purchase revenue RevenueCat tracks in a month; the billing base for the Pro plan.
  unit: usd
  aggregation: sum
  dimensions:
  - project
  - app
  - store
- name: pro_fee
  description: 1% fee on monthly tracked revenue above the $2,500 free allowance.
  unit: usd
  aggregation: sum
  dimensions:
  - project
- name: growth_tools_revenue
  description: Revenue from conversions attributed to RevenueCat paywalls and web-to-app funnels, billed at 1%.
  unit: usd
  aggregation: sum
  dimensions:
  - project
  - tool
- name: active_subscriptions
  description: Count of active subscriptions monitored, a driver of tracked revenue.
  unit: subscriptions
  aggregation: sum
  dimensions:
  - project
  - app
  - product
principles:
- name: Visibility
  description: Use RevenueCat Charts and the v2 API to attribute tracked revenue by project, app, product, and store.
- name: Allocation
  description: Separate projects/apps per product line so RevenueCat cost maps to internal cost centers and revenue streams.
- name: Optimization
  description: Keep tracking configuration accurate to avoid over-counting MTR; prune stale products/entitlements; negotiate Enterprise volume discounts as MTR grows.
- name: Accountability
  description: Assign an owner per project; reconcile the RevenueCat invoice against tracked revenue and store payouts monthly.
