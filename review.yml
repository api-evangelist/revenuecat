aid: revenuecat
name: RevenueCat
review:
  question: Does RevenueCat expose a documented public WebSocket API?
  answer: false
  date: '2026-07-01'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. RevenueCat's only asynchronous surface
    is outbound webhooks (RevenueCat POSTs subscription lifecycle events to a
    customer-hosted HTTPS endpoint). Webhooks are HTTP request/response, not a
    persistent streaming transport, and are documented in apis.yml as a
    Webhooks surface with links to the event-type reference.
findings:
  summary: |
    RevenueCat does not publish a documented public WebSocket API. The platform
    exposes two HTTPS REST APIs - v1 at https://api.revenuecat.com/v1 for live
    subscribers, purchases/receipts, entitlements, offerings, and subscriber
    attributes, and v2 at https://api.revenuecat.com/v2 for the project catalog
    (projects, apps, customers, products, entitlements, offerings, packages).
    Both use HTTP Bearer authentication with RevenueCat API keys. Real-time
    event delivery is handled by outbound webhooks, not by any ws:// or wss://
    endpoint. No bidirectional or streaming WebSocket surface is documented.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.revenuecat.com/v1
      documented: true
    - protocol: REST
      scheme: https
      baseURL: https://api.revenuecat.com/v2
      documented: true
    - protocol: Webhook
      scheme: https
      note: Outbound HTTP POST of subscription lifecycle events to a customer endpoint. Not WebSocket.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in the v1 or v2 REST reference or the webhooks documentation as of the review date.
  endpointsConfirmedRest:
    - GET    https://api.revenuecat.com/v1/subscribers/{app_user_id}
    - DELETE https://api.revenuecat.com/v1/subscribers/{app_user_id}
    - POST   https://api.revenuecat.com/v1/subscribers/{app_user_id}/attributes
    - POST   https://api.revenuecat.com/v1/receipts
    - POST   https://api.revenuecat.com/v1/subscribers/{app_user_id}/transactions/{store_transaction_identifier}/refund
    - POST   https://api.revenuecat.com/v1/subscribers/{app_user_id}/subscriptions/{product_identifier}/defer
    - POST   https://api.revenuecat.com/v1/subscribers/{app_user_id}/entitlements/{entitlement_identifier}/promotional
    - POST   https://api.revenuecat.com/v1/subscribers/{app_user_id}/entitlements/{entitlement_identifier}/revoke_promotionals
    - GET    https://api.revenuecat.com/v1/subscribers/{app_user_id}/offerings
    - POST   https://api.revenuecat.com/v1/subscribers/{app_user_id}/offerings/{offering_uuid}/override
    - GET    https://api.revenuecat.com/v2/projects
    - GET    https://api.revenuecat.com/v2/projects/{project_id}/apps
    - POST   https://api.revenuecat.com/v2/projects/{project_id}/apps
    - GET    https://api.revenuecat.com/v2/projects/{project_id}/apps/{app_id}
    - DELETE https://api.revenuecat.com/v2/projects/{project_id}/apps/{app_id}
    - GET    https://api.revenuecat.com/v2/projects/{project_id}/customers
    - POST   https://api.revenuecat.com/v2/projects/{project_id}/customers
    - GET    https://api.revenuecat.com/v2/projects/{project_id}/customers/{customer_id}
    - DELETE https://api.revenuecat.com/v2/projects/{project_id}/customers/{customer_id}
    - GET    https://api.revenuecat.com/v2/projects/{project_id}/products
    - POST   https://api.revenuecat.com/v2/projects/{project_id}/products
    - GET    https://api.revenuecat.com/v2/projects/{project_id}/entitlements
    - POST   https://api.revenuecat.com/v2/projects/{project_id}/entitlements
    - GET    https://api.revenuecat.com/v2/projects/{project_id}/offerings
    - POST   https://api.revenuecat.com/v2/projects/{project_id}/offerings
    - GET    https://api.revenuecat.com/v2/projects/{project_id}/offerings/{offering_id}/packages
    - POST   https://api.revenuecat.com/v2/projects/{project_id}/offerings/{offering_id}/packages
sources:
  - url: https://www.revenuecat.com/docs/api-v1
    type: APIReference
    note: v1 REST reference; all endpoints are HTTPS. Base URL https://api.revenuecat.com/v1.
  - url: https://www.revenuecat.com/docs/api-v2
    type: APIReference
    note: v2 REST reference; all endpoints are HTTPS. Base URL https://api.revenuecat.com/v2.
  - url: https://www.revenuecat.com/docs/integrations/webhooks
    type: Documentation
    note: Real-time events are delivered via outbound webhooks (HTTP POST), not WebSocket.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. RevenueCat's asynchronous delivery is
    outbound webhooks, which are modeled as a Webhooks API surface in apis.yml
    with links to the webhook and event-type documentation. No AsyncAPI document
    was created because webhooks are request/response HTTP callbacks rather than
    a persistent streaming transport.
